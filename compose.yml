services:
  nostos:
    image: ghcr.io/christian-gennari/nostos:${NOSTOS_IMAGE_TAG:-latest}
    ports:
      - "5099:8080"
    volumes:
      - nostos-data:/data
      # Optional: read audiobooks and ebooks you already have, without copying
      # them. Uncomment this line and the two "environment" lines below, and
      # replace /mnt/audiobooks with your folder. ":ro" keeps it read-only.
      # Full steps: docs/external-media.md
      # - /mnt/audiobooks:/external/media:ro
    # environment:
    #   ExternalMedia__Root: /external/media
    restart: unless-stopped

volumes:
  nostos-data:
