<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Direction C — Minimal · Ask Nostos Empty State (#1589)</title>
  <link rel="stylesheet" href="./mockups.css" />
  <script src="./mockups.js"></script>
</head>
<body class="dir-c">
  <div id="library-backdrop-host"></div>

  <div class="assistant-scrim" aria-hidden="true"></div>
  <section class="assistant-panel" role="dialog" aria-label="Nostos assistant">
    <header class="assistant-header">
      <div class="assistant-heading">
        <span class="assistant-mark" aria-hidden="true"><span data-icon="sparkle" data-size="14"></span></span>
        <span class="assistant-title">Ask Nostos</span>
      </div>
      <div class="assistant-header-actions">
        <button type="button" class="assistant-header-action assistant-info" aria-label="About Ask Nostos" aria-expanded="false" title="About Ask Nostos">
          <span data-icon="info" data-size="14"></span>
        </button>
        <button type="button" class="assistant-header-action" aria-label="New conversation" title="New conversation">
          <span data-icon="plus" data-size="14"></span>
        </button>
        <button type="button" class="assistant-header-action assistant-expand" aria-label="Expand Ask Nostos" title="Expand Ask Nostos">
          <span data-icon="corners-out" data-size="14"></span>
        </button>
        <button type="button" class="assistant-header-action" aria-label="Close Ask Nostos" title="Close Ask Nostos">
          <span data-icon="x" data-size="14"></span>
        </button>
      </div>
      <div class="boundary-popover" hidden role="note">
        <strong>How Ask Nostos works</strong>
        Ask about your books and notes, capture thoughts, or propose library changes for your review. It never deletes books or notes, or changes settings.
      </div>
    </header>

    <div class="assistant-body">
      <div class="empty-stage">
        <h2 class="empty-invitation">Ask, note, or organise</h2>

        <div class="composer-shell">
          <textarea
            class="composer-field"
            rows="2"
            placeholder="Start typing, or press / for ideas…"
            aria-label="Ask Nostos, or capture a thought"
          ></textarea>
          <div class="composer-footer">
            <button type="button" class="slash-trigger" aria-expanded="false" aria-controls="slash-ideas">
              <span class="slash-key" aria-hidden="true">/</span>
              <span>Ideas</span>
            </button>
            <div class="voice-row">
              <button type="button" class="voice-control" aria-label="Record a voice note">
                <span data-icon="microphone" data-size="14"></span>
              </button>
            </div>
          </div>
        </div>

        <div id="slash-ideas" class="slash-popover" hidden role="region" aria-label="Prompt ideas">
          <button type="button" class="slash-item" data-prefill="What should I read next from my library?">
            <span>What should I read next from my library?</span>
            <span data-icon="arrow-elbow-down-left" data-size="13"></span>
          </button>
          <button type="button" class="slash-item" data-prefill="Save this thought: ">
            <span>Save a thought or quote to my notes</span>
            <span data-icon="arrow-elbow-down-left" data-size="13"></span>
          </button>
          <button type="button" class="slash-item" data-prefill="Group my unread books into a collection">
            <span>Group my unread books into a collection</span>
            <span data-icon="arrow-elbow-down-left" data-size="13"></span>
          </button>
          <p class="slash-foot">Ask Nostos never deletes books or notes, or changes settings.</p>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
