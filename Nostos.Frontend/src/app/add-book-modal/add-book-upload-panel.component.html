<section
  class="upload-view"
  data-testid="add-book-upload-view"
  aria-labelledby="upload-view-heading"
>
  <div class="upload-view__head">
    <span appIconTile [size]="40" aria-hidden="true">
      <nostos-icon name="upload-simple" [size]="22"></nostos-icon>
    </span>
    <div class="upload-view__copy">
      <span class="review-eyebrow">
        {{ error() ? 'Upload interrupted' : 'Adding your book' }}
      </span>
      <h3 id="upload-view-heading">{{ bookTitle() }}</h3>
      @if (fileName(); as name) {
        <p data-testid="add-book-upload-file">{{ name }}</p>
      }
    </div>
  </div>

  @if (error(); as err) {
    <div appNotice tone="danger" class="upload-failure" role="alert">
      <span class="upload-failure__message">
        <nostos-icon name="warning-circle" [size]="14"></nostos-icon>
        {{ err }}
      </span>
    </div>
    <div class="upload-view__actions">
      <button
        appButton
        type="button"
        variant="primary"
        data-testid="add-book-upload-retry"
        [disabled]="submitting()"
        (click)="retry.emit()"
      >
        Try again
      </button>
      <button
        appButton
        type="button"
        variant="secondary"
        data-testid="add-book-upload-stop"
        [disabled]="stopping()"
        (click)="stop.emit()"
      >
        Stop upload
      </button>
    </div>
  } @else {
    <div class="upload-view__progress">
      <nostos-progress size="md" [value]="progress()" [label]="statusText()" />
      <p class="upload-view__status" role="status">{{ statusText() }}</p>
    </div>
    <button
      appButton
      type="button"
      variant="secondary"
      data-testid="add-book-upload-stop"
      [disabled]="stopping()"
      (click)="stop.emit()"
    >
      Stop upload
    </button>
  }
</section>
