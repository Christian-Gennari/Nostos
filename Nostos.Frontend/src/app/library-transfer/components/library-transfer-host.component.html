<div class="transfer-host" data-testid="library-transfer-host">
  <section class="transfer-host__entry" role="group" aria-label="Export library">
    <app-library-export-flow />
  </section>
  <section
    #importEntry
    class="transfer-host__entry"
    [class.transfer-host__entry--selected]="focusImport()"
    id="manage-library-import-entry"
    data-testid="library-transfer-import-entry"
    role="group"
    aria-label="Import library"
    tabindex="-1"
    [attr.aria-current]="focusImport() ? 'step' : null"
  >
    <app-library-import-flow
      [supportsSafeActivation]="supportsSafeActivation()"
      [activationState]="activation.state()"
      [activationErrorCode]="activation.errorCode()"
      [activationPhase]="activation.phase()"
      [activationCanRetry]="activation.canRetry()"
      [activationConflict]="activation.conflict()"
      [activationRecoveryExpiresAtUtc]="activation.recovery()?.expiresAtUtc ?? null"
      (importCompleted)="importCompleted.emit()"
      (activationRequested)="onActivationRequested($event)"
      (replacementConfirmed)="onReplacementConfirmed($event)"
    />
  </section>
</div>
