<div class="picker">
  <div class="picker-head">
    <span class="form-label">{{ label() }}</span>
    @if (hasSelection()) {
      <button type="button" appButton variant="link" class="picker-clear" (click)="clear()">Clear all</button>
    }
  </div>

  <!-- Current memberships, readable at a glance and removable one at a time.
       Removing a single membership was impossible before this control. -->
  @if (hasSelection()) {
    <ul class="chips" aria-label="Selected collections">
      @for (collection of selected(); track collection.id) {
        <li class="chip">
          <span class="chip-name">{{ collection.name }}</span>
          <button
            type="button"
            class="chip-remove"
            [attr.aria-label]="'Remove from ' + collection.name"
            (click)="remove(collection.id)"
          >
            <nostos-icon name="x" [size]="12"></nostos-icon>
          </button>
        </li>
      }
    </ul>
  }

  <!-- role="group" + aria-pressed: these are toggles, not a radiogroup — more
       than one may be active at once, which is the whole point of the change. -->
  <div class="options" role="group" [attr.aria-label]="label()">
    @for (option of options(); track option.id) {
      <button
        type="button"
        class="option"
        [class.selected]="isSelected(option.id)"
        [style.--depth]="option.level"
        [attr.aria-pressed]="isSelected(option.id)"
        [attr.data-collection-id]="option.id"
        (click)="toggle(option.id)"
      >
        <span class="option-check" aria-hidden="true">
          @if (isSelected(option.id)) {
            <nostos-icon name="check" [size]="12"></nostos-icon>
          }
        </span>
        <span class="option-name">{{ option.name }}</span>
      </button>
    } @empty {
      <p class="options-empty">No collections yet.</p>
    }
  </div>
</div>
