@if (isOpen()) {
<div class="palette-backdrop" (click)="close()"></div>
<div
  class="palette"
  role="dialog"
  aria-modal="true"
  aria-label="Quick search"
>
  <div class="palette-input-row">
    <nostos-icon name="magnifying-glass" [size]="16" class="palette-input-icon"></nostos-icon>
    <input
      #paletteInput
      class="palette-input"
      type="text"
      placeholder="Search books, collections, actions…"
      autocomplete="off"
      spellcheck="false"
      [value]="query()"
      (input)="onQueryChange(paletteInput.value)"
      aria-label="Search books, collections and actions"
      data-testid="palette-input"
    />
    @if (searching()) {
    <nostos-loading-indicator class="palette-loading" decorative size="sm" />
    }
  </div>

  <div class="palette-results" role="listbox" aria-label="Results">
    @for (entry of entries(); track entry.kind + ':' + entry.id; let i = $index) {
    <button
      class="palette-item"
      [class.active]="i === activeIndex()"
      role="option"
      [attr.aria-selected]="i === activeIndex()"
      (click)="run(entry)"
      (mouseenter)="activeIndex.set(i)"
      [attr.data-testid]="'palette-item-' + entry.kind"
    >
      @if (entry.kind === 'book') {
      <nostos-icon name="book" [size]="15"></nostos-icon>
      } @else if (entry.kind === 'collection') {
      <nostos-icon name="folder" [size]="15"></nostos-icon>
      } @else {
      <nostos-icon name="arrow-right" [size]="15"></nostos-icon>
      }
      <span class="palette-item-label">{{ entry.label }}</span>
      <span class="palette-item-sub">{{ entry.sub }}</span>
    </button>
    } @empty {
    <p class="palette-empty">
      @if (query().trim()) {
      No matches for “{{ query().trim() }}”.
      } @else {
      Type to search your library.
      }
    </p>
    }
  </div>

  <div class="palette-hint">
    <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
    <span><kbd>↵</kbd> open</span>
    <span><kbd>esc</kbd> close</span>
    <span><kbd>ctrl/⌘ K</kbd> toggle</span>
  </div>
</div>
}
