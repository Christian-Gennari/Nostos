@if (isOpen()) {
  <div
    class="modal-backdrop"
    [appScrollLock]="true"
    [class.is-sheet]="variant() === 'sheet'"
    [style.z-index]="layer()"
    (pointerdown)="onBackdropPointerDown($event)"
    (pointerup)="onBackdropPointerUp($event)"
    (pointercancel)="onBackdropPointerCancel($event)"
    role="presentation"
  >
    <div
      class="modal-card"
      [class]="cardClass()"
      [class.is-sheet]="variant() === 'sheet'"
      [style.--modal-max-width]="maxWidth()"
      [style.--modal-max-height]="maxHeight()"
      [attr.role]="dialogRole()"
      aria-modal="true"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-labelledby]="ariaLabelledBy()"
      [attr.aria-describedby]="ariaDescribedBy()"
      [cdkTrapFocus]="trapFocus()"
      [cdkTrapFocusAutoCapture]="trapFocus()"
      (click)="$event.stopPropagation()"
    >
      <div class="modal-head" [class.is-divided]="headDivider()" [class.has-close]="!!closeLabel()">
        <div class="modal-head-content">
          <ng-content select="[shellHeader]"></ng-content>
        </div>
        @if (closeLabel(); as label) {
          <!-- The one close control of a dialog. Callers name it (closeLabel)
               and leave it out of their header. -->
          <button
            appIconButton
            type="button"
            icon="x"
            class="modal-close"
            [glyphSize]="20"
            [attr.aria-label]="label"
            title="Close"
            [attr.cdkFocusInitial]="closeFocusInitial() ? '' : null"
            [disabled]="busy()"
            data-testid="modal-close"
            (click)="closed.emit()"
          ></button>
        }
      </div>

      <ng-content select="[shellTabs]"></ng-content>

      <div class="modal-scroll">
        <ng-content></ng-content>
      </div>

      <ng-content select="[shellActions]"></ng-content>
    </div>
  </div>
}
