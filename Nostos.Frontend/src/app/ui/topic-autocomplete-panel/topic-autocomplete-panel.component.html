<!-- The option rows.
     mousemove, not mouseenter: a row that merely appears under a resting pointer
     must not take the highlight away from the first result. -->
<ng-template #options>
  @for (topic of auto.suggestions(); track topic.id; let i = $index) {
  <button
    type="button"
    appTopicOption
    class="item"
    role="option"
    tabindex="-1"
    [id]="auto.optionId(i)"
    [name]="topic.name"
    [count]="topic.usageCount"
    [active]="i === auto.activeIndex()"
    [attr.aria-selected]="i === auto.activeIndex()"
    (mousemove)="auto.activeIndex.set(i)"
    (click)="select(topic.name, $event)"
  ></button>
  }

  @if (auto.createName(); as name) {
  <button
    type="button"
    appTopicOption
    kind="create"
    class="item create-item"
    role="option"
    tabindex="-1"
    [id]="auto.optionId(auto.suggestions().length)"
    [name]="name"
    [active]="auto.activeIndex() === auto.suggestions().length"
    [attr.aria-selected]="auto.activeIndex() === auto.suggestions().length"
    (mousemove)="auto.activeIndex.set(auto.suggestions().length)"
    (click)="select(name, $event)"
  ></button>
  }
</ng-template>

<!-- Typing `[[`: the textarea is already the search field, so this is only the
     list. mousedown is cancelled so choosing a row never takes the caret away. -->
<ng-template #inlineTpl>
  <div class="suggest-panel" (mousedown)="$event.preventDefault()">
    <div class="picker-list" role="listbox" aria-label="Topics" [id]="auto.listId">
      <ng-container [ngTemplateOutlet]="options"></ng-container>

      @if (auto.optionCount() === 0) {
      <p class="picker-empty">{{ noTopics }}</p>
      }
    </div>
  </div>
</ng-template>
