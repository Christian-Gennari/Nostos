@if (menu(); as currentMenu) {
  <div
    class="block-menu"
    data-testid="block-menu"
    [style.top.px]="placement()?.top ?? null"
    [style.bottom.px]="placement()?.bottom ?? null"
    [style.left.px]="placement()?.left ?? null"
    [style.max-height.px]="placement()?.maxHeight ?? null"
  >
    @if (imageMode()) {
      <form class="block-menu-image" (submit)="$event.preventDefault(); imageSubmit.emit()">
        <label class="block-menu-image-label" [attr.for]="blockImageInputId">Image address</label>
        <!-- type=text: a relative address (/images/cover.jpg) is a fine image too,
             and type=url would refuse it silently. -->
        <div class="block-menu-image-row">
          <input
            #blockImageInput
            [id]="blockImageInputId"
            class="editor-url-input"
            type="text"
            inputmode="url"
            autocomplete="off"
            spellcheck="false"
            placeholder="https://…/image.jpg"
            [value]="imageUrl()"
            (input)="imageUrlChange.emit($any($event.target).value)"
            (keydown.escape)="imageCancel.emit()"
          />
          <button type="submit" class="editor-bubble-btn editor-url-apply">Insert</button>
        </div>
      </form>
    } @else if (currentMenu.items.length) {
      <ul class="block-menu-list" role="listbox" aria-label="Insert a block">
        @for (item of currentMenu.items; track item.action; let i = $index) {
          <li
            class="block-menu-item"
            role="option"
            [attr.aria-selected]="i === activeIndex()"
            [class.active]="i === activeIndex()"
            (mousedown)="$event.preventDefault()"
            (mouseenter)="activeIndexChange.emit(i)"
            (click)="actionSelect.emit(item.action)"
          >
            <span class="block-menu-label">{{ item.label }}</span>
            <kbd class="block-menu-hint">{{ item.hint }}</kbd>
          </li>
        }
      </ul>
    } @else {
      <p class="block-menu-empty">No block matches.</p>
    }
  </div>
}
