<!-- Formatting appears only where text is selected (issue #1040): the page
     itself carries no toolbar. -->
<app-editor-selection-bubble
  #bubble
  [activeBlock]="activeBlock()"
  [isBold]="isBold()"
  [isItalic]="isItalic()"
  [isLink]="isLink()"
  [urlPrompt]="urlPrompt()"
  [urlValue]="urlValue()"
  (toggleBold)="toggleBold()"
  (toggleItalic)="toggleItalic()"
  (toggleBlock)="toggleBlock($event)"
  (addFootnote)="addFootnote()"
  (openUrlPrompt)="openUrlPrompt($event)"
  (urlValueChange)="urlValue.set($event)"
  (applyUrl)="applyUrl()"
  (cancelUrl)="cancelUrl()"
/>

<app-editor-block-menu
  #blockMenuHost
  [menu]="blockMenu()"
  [activeIndex]="blockMenuActive()"
  [imageMode]="blockMenuImage()"
  [imageUrl]="blockMenuImageUrl()"
  (activeIndexChange)="blockMenuActive.set($event)"
  (actionSelect)="runBlockAction($event)"
  (imageUrlChange)="blockMenuImageUrl.set($event)"
  (imageSubmit)="applyBlockImage()"
  (imageCancel)="cancelBlockImage()"
/>

<app-editor-source-suggestion
  #sourceSuggestionHost
  [editor]="editorInstance()"
  [editorDom]="editorDom()"
  [activeId]="sourceSuggestionActiveId()"
  [keyDownHandler]="sourceSuggestionKeyDown()"
  (suggestionChange)="sourceSuggestion.emit($event)"
  (openChange)="sourceSuggestionOpen.set($event)"
/>

<div
  class="manuscript-scroll"
  #scroller
  [appTypewriterScroll]="typewriter()"
  [typewriterEditor]="editorInstance()"
  [appTypewriterSound]="sounds()"
  [typewriterSoundVolume]="soundVolume()"
  [typewriterSoundPack]="soundPack()"
  [typewriterSoundTarget]="editorDom()"
  [typewriterSuppressReturn]="!!blockMenu() || sourceSuggestionOpen()"
>
  <div class="nostos-manuscript" [class.editor-starting]="editorStarting()" #mount></div>
</div>
