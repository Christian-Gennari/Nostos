@if (urlPrompt(); as kind) {
  <form class="editor-bubble-url" (submit)="$event.preventDefault(); applyUrl.emit()">
    <input
      #urlInput
      class="editor-url-input"
      type="url"
      autocomplete="off"
      spellcheck="false"
      aria-label="Link address"
      placeholder="https://… (empty removes the link)"
      [value]="urlValue()"
      (input)="urlValueChange.emit($any($event.target).value)"
      (keydown.escape)="cancelUrl.emit()"
    />
    <button type="submit" class="editor-bubble-btn editor-url-apply">Apply</button>
  </form>
} @else {
  <button type="button" class="editor-bubble-btn editor-mark-bold" title="Bold (Ctrl+B)" aria-label="Bold" [class.active]="isBold()" [attr.aria-pressed]="isBold()" (mousedown)="$event.preventDefault()" (click)="toggleBold.emit()">B</button>
  <button type="button" class="editor-bubble-btn editor-mark-italic" title="Italic (Ctrl+I)" aria-label="Italic" [class.active]="isItalic()" [attr.aria-pressed]="isItalic()" (mousedown)="$event.preventDefault()" (click)="toggleItalic.emit()">I</button>
  <span class="editor-bubble-sep" aria-hidden="true"></span>
  <button type="button" class="editor-bubble-btn" title="Heading (Ctrl+Alt+2)" aria-label="Heading 2" [class.active]="activeBlock() === 'h2'" [attr.aria-pressed]="activeBlock() === 'h2'" (mousedown)="$event.preventDefault()" (click)="toggleBlock.emit('h2')">H2</button>
  <button type="button" class="editor-bubble-btn" title="Subheading (Ctrl+Alt+3)" aria-label="Heading 3" [class.active]="activeBlock() === 'h3'" [attr.aria-pressed]="activeBlock() === 'h3'" (mousedown)="$event.preventDefault()" (click)="toggleBlock.emit('h3')">H3</button>
  <button type="button" class="editor-bubble-btn editor-mark-quote" title="Quote (Ctrl+Shift+B)" aria-label="Quote" [class.active]="activeBlock() === 'blockquote'" [attr.aria-pressed]="activeBlock() === 'blockquote'" (mousedown)="$event.preventDefault()" (click)="toggleBlock.emit('blockquote')">“</button>
  <span class="editor-bubble-sep" aria-hidden="true"></span>
  <button type="button" class="editor-bubble-btn editor-add-footnote" title="Footnote (Ctrl+Alt+F)" aria-label="Add footnote" (mousedown)="$event.preventDefault()" (click)="addFootnote.emit()">a<sup>1</sup></button>
  <button appIconButton icon="link-simple" [glyphSize]="16" weight="thin" class="editor-bubble-link" title="Link" aria-label="Link" [pressed]="isLink()" (mousedown)="$event.preventDefault()" (click)="openUrlPrompt.emit('link')"></button>
}
