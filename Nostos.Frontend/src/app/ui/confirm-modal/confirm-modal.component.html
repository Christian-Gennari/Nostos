@if (isOpen()) {
  <app-modal-shell
    [isOpen]="true"
    variant="dialog"
    cardClass="confirm-modal-card"
    [maxWidth]="'420px'"
    [layer]="120"
    [busy]="busy()"
    [trapFocus]="trapFocus()"
    dialogRole="alertdialog"
    ariaLabelledBy="confirm-dialog-title"
    [ariaDescribedBy]="description() ? 'confirm-dialog-description' : null"
    [headDivider]="false"
    [style.--modal-head-padding]="'0'"
    [style.--modal-card-padding]="'1.5rem 1.5rem 1.25rem'"
    [style.--modal-card-padding-narrow]="'1.25rem 1.15rem 1.1rem'"
    (closed)="cancel.emit()"
  >
    <div class="confirm-modal-head" shellHeader>
      @if (tone() === 'danger') {
        <span class="confirm-mark" aria-hidden="true">
          <nostos-icon name="trash" [size]="15"></nostos-icon>
        </span>
      }
      <h2 id="confirm-dialog-title" class="confirm-title">{{ heading() }}</h2>
    </div>

    @if (description()) {
      <p id="confirm-dialog-description" class="confirm-description">{{ description() }}</p>
    }

    <ng-content></ng-content>

    <app-dialog-actions
      shellActions
      variant="inset"
      [stackOnNarrow]="stackOnNarrow()"
      class="confirm-actions"
    >
      <button
        appButton
        type="button"
        variant="secondary"
        class="btn-cancel"
        (click)="cancel.emit()"
        [disabled]="busy()"
      >
        {{ cancelLabel() }}
      </button>
      <button
        appButton
        type="button"
        [variant]="tone() === 'danger' ? 'danger' : 'primary'"
        class="btn-confirm"
        [busy]="busy()"
        (click)="confirm.emit()"
        [disabled]="busy() || confirmDisabled()"
      >
        @if (busy()) {
          <nostos-icon name="circle-notch" [size]="14" class="spin-icon"></nostos-icon>
          <span>{{ busyLabel() }}</span>
        } @else {
          @if (tone() === 'danger') {
            <nostos-icon name="trash" [size]="14"></nostos-icon>
          }
          <span>{{ confirmLabel() }}</span>
        }
      </button>
    </app-dialog-actions>
  </app-modal-shell>
}
