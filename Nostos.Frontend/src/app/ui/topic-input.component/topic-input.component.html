<div class="topic-input-wrapper">
  <div class="topic-link-toolbar">
    <button
      appButton
      variant="ghost"
      size="sm"
      type="button"
      class="topic-link-action"
      aria-haspopup="dialog"
      [disabled]="isDisabled"
      (pointerdown)="rememberSelection()"
      (click)="openTopicPicker()"
    >
      <nostos-icon name="link-simple" [size]="14"></nostos-icon>
      <span>Link a topic</span>
    </button>
  </div>

  <textarea
    #textarea
    class="note-input"
    [class.disabled]="isDisabled"
    [rows]="rows"
    [placeholder]="placeholder"
    [value]="value"
    [disabled]="isDisabled"
    (input)="handleInput($event)"
    (blur)="onTouched()"
    noteAutocomplete
    [attr.aria-controls]="inlineOpen() ? autocompleteService.listId : null"
    [attr.aria-activedescendant]="inlineOpen() ? autocompleteService.activeOptionId() : null"
    (insertTopicName)="insertTopicName($event)"
    (keydown.control.enter)="submitTrigger.emit()"
  ></textarea>

  <topic-autocomplete-panel
    [anchor]="textarea"
    (topicNameSelected)="insertTopicName($event)"
    (cancelled)="cancelTopicPicker()"
  ></topic-autocomplete-panel>
</div>
