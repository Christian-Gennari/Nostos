<div class="sidebar-header">
  <div class="sidebar-title-row">
    <h2>Studio</h2>
    <div class="actions">
      <button
        appButton
        variant="secondary"
        size="sm"
        class="files-new-document"
        type="button"
        (click)="createDocument.emit()"
        title="New document"
        aria-label="New document"
      >
        <nostos-icon name="plus" [size]="14"></nostos-icon>
        New
      </button>
      <button
        appIconButton
        size="xs"
        icon="folder-plus"
        [glyphSize]="16"
        weight="thin"
        (click)="createFolder.emit()"
        title="New folder"
        aria-label="New folder"
      ></button>
      @if (isDrawerMode()) {
        <button
          appIconButton
          size="xs"
          class="files-rail-collapse"
          icon="sidebar-simple"
          [glyphSize]="16"
          weight="thin"
          (click)="collapseRail.emit()"
          [title]="railLabel()"
          [attr.aria-label]="railLabel()"
          [attr.aria-expanded]="isOpen()"
          [attr.aria-pressed]="isOpen()"
        ></button>
      }
    </div>
  </div>
</div>

<div class="file-list">
  @if (treeFailed()) {
    <nostos-empty-state compact error message="Your writings could not be loaded." (retry)="retryLoad.emit()" />
  } @else {
    <app-flat-tree
      [items]="items()"
      [activeId]="activeId()"
      [editingId]="editingId()"
      [renameError]="renameError()"
      [renameBusy]="renameBusy()"
      (nodeSelected)="nodeSelected.emit($event)"
      (nodeMoved)="nodeMoved.emit($event)"
      (nodeRenamed)="nodeRenamed.emit($event)"
      (nodeDeleted)="nodeDeleted.emit($event)"
      (nodeRenameSaved)="nodeRenameSaved.emit($event)"
      (nodeRenameCancelled)="nodeRenameCancelled.emit()"
    ></app-flat-tree>
  }
</div>
