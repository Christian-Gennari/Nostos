<div class="brain-scroller">
  <header class="note-head">
    <button type="button" appButton variant="ghost" class="place-switch" aria-controls="brain-sidebar"
      [attr.aria-expanded]="state.drawerOpen()" (click)="openDrawer()">
      <span>Note</span><nostos-icon name="caret-down" [size]="14" />
    </button>
    <a appButton variant="ghost" size="sm" class="back-link" routerLink="/brain">
      <nostos-icon name="arrow-left" [size]="14" />
      <span>All notes</span>
    </a>
    <h1 class="page-title">{{ note()?.bookTitle || 'Note' }}</h1>
  </header>

  <main class="note-column" aria-label="Note">
    @if (failed()) {
    <nostos-empty-state error concept="note" message="This note could not be found. It may have been deleted." (retry)="retry()">
      <a appButton variant="secondary" size="sm" routerLink="/brain">All notes</a>
    </nostos-empty-state>
    } @else if (note(); as current) {
    <app-note-item
      [note]="current"
      [topics]="state.topics()"
      [topicMap]="state.lookup()"
      [busy]="noteActions.busy().has(current.id)"
      [canSelect]="false"
      [showFormat]="(current.editionCount ?? 1) > 1"
      [suggestions]="suggestions.namesFor(current.id)"
      [suggestionState]="suggestions.stateFor(current.id)"
      (topicAdded)="noteActions.addTopic(current, $event)"
      (topicRemoved)="noteActions.removeTopic(current, $event)"
      (pickerOpened)="suggestions.request(current)"
      (pickerClosed)="suggestions.closeFor(current.id)"
      (edited)="noteActions.edit($event)"
      (keepWithWriting)="noteActions.keepWithWriting([current.id])"
      (moreFromBook)="moreFromBook(current)"
      (deleteRequested)="noteActions.askDelete([current.id])"
      (restored)="noteActions.restored($event)"
    />
    } @else {
    <nostos-loading-indicator class="list-loading" label="Loading the note" />
    }
  </main>
</div>

<app-brain-note-dialogs />
