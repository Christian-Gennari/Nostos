<div class="brain-scroller">
  <header class="note-head">
    <button type="button" appButton variant="ghost" class="place-switch" aria-controls="brain-sidebar"
      [attr.aria-expanded]="state.drawerOpen()" (click)="openDrawer()">
      <span>Note</span><nostos-icon name="caret-down" [size]="14" />
    </button>
    <a appButton variant="ghost" size="sm" class="back-link" routerLink="/brain">
      <nostos-icon name="arrow-left" [size]="14" />
      <span>All notes</span>
    </a>
  </header>

  <main class="note-column" aria-label="Note">
    @if (failed()) {
    <nostos-empty-state error concept="note" message="This note could not be found. It may have been deleted." (retry)="retry()">
      <a appButton variant="secondary" size="sm" routerLink="/brain">All notes</a>
    </nostos-empty-state>
    } @else if (note(); as current) {
    <app-brain-note-detail
      [note]="current"
      [quoteSize]="'md'"
      (moreFromBook)="moreFromBook(current)"
      (relatedChosen)="openNote($event)"
    />
    } @else {
    <nostos-loading-indicator class="list-loading" label="Loading the note" />
    }
  </main>
</div>

<app-brain-note-dialogs />
