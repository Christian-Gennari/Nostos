<div class="route-progress" [class.active]="navigationPending()" aria-hidden="true"></div>
@if (cloudEntry.productReady()) {
  <router-outlet />
  <app-toast-container />
  <!-- Loaded on first open (or when the browser is idle), so the initial
       bundle does not carry the palette; CommandPaletteService owns the
       shortcut until then. -->
  @defer (when palette.isOpen(); prefetch on idle) {
    <app-command-palette />
  }
  <app-highlight-import-modal />
  <!-- The passage viewer (issue #1014), opened from any note list through
       PassageViewerService. Loaded on first open. -->
  @defer (when passageViewer.request(); prefetch on idle) {
    <app-passage-viewer />
  }
  <app-assistant />
} @else {
  <app-cloud-entry />
}
@if (
  cloudEntry.supportsLibraryMigration() &&
  (cloudEntry.productReady() || cloudEntry.view().kind === 'first_run')
) {
  <app-library-transfer-indicator />
}
<!-- Root-level interaction boundary: activation can continue after leaving
     Settings, so the cutover must block the whole app, not just one host. -->
<app-library-activation-overlay [state]="activation.state()" [phase]="activation.phase()" />
