<div class="route-progress" [class.active]="navigationPending()" aria-hidden="true"></div>
@if (cloudEntry.productReady()) {
  <router-outlet />
  <app-toast-container />
  <app-command-palette />
  <app-highlight-import-modal />
  <app-assistant />
} @else {
  <app-cloud-entry />
}
<!-- Root-level interaction boundary: activation can continue after leaving
     Settings, so the cutover must block the whole app, not just one host. -->
<app-library-activation-overlay [state]="activation.state()" [phase]="activation.phase()" />
