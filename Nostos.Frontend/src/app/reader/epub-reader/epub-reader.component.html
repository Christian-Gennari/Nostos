<div class="epub-container">
  <!-- The margin preset is padding on this box, so epub.js paginates the page
       into what remains. Doing it here instead of inside the book's own
       document avoids a race with the inline-important body padding epub.js
       writes while it lays a section out. -->
  <div
    id="epub-viewer"
    [style.--reader-margin]="marginInset() + '%'"
    [style.--reader-margin-ratio]="marginInset() / 100"
    (click)="onViewerMarginClick($event)"
  >
    <div id="epub-page"></div>
  </div>
</div>

@if (sourceNavigationMessage(); as sourceMessage) {
  <p class="source-navigation-status" role="status" aria-live="polite">{{ sourceMessage }}</p>
}

<!-- Held mounted so the reader keeps one stable geometry while epub.js opens.
     Only the small shared indicator fades away; the page surface never changes. -->
<div class="loading-overlay" [class.is-hidden]="!loading()" [attr.aria-hidden]="!loading()">
  <nostos-loading-indicator label="Opening book" size="xl" />
</div>


@if (errorMessage()) {
<div class="error-overlay" role="alert" aria-live="assertive">
  <div class="error-state">
    <h2>Could not open this EPUB</h2>
    <p>{{ errorMessage() }}</p>
    <div class="error-actions">
      <button appButton type="button" variant="secondary" (click)="leaveReader()">Back</button>
      <button appButton type="button" variant="primary" (click)="retryLoad()">Retry</button>
    </div>
  </div>
</div>
}
