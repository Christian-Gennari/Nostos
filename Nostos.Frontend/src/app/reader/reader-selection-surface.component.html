@if (placement(); as place) {
<div class="selection-scrim" (click)="cancelled.emit()" aria-hidden="true" data-testid="selection-scrim"></div>
<div
  class="selection-menu"
  role="dialog"
  aria-label="Selection actions"
  data-testid="selection-menu"
  [style.left.px]="place.left"
  [style.width.px]="place.width"
  [style.top.px]="place.top"
  [style.bottom.px]="place.bottom"
  [style.max-height.px]="place.maxHeight"
>
  <div class="selection-popover-head">
    <blockquote appQuote size="sm" [lines]="3" [pen]="highlightColour()" class="selection-quote selected-text"
      [title]="preview()">{{ preview() }}</blockquote>
    @if (!noteDraftOpen()) {
      <div class="selection-utility-rail">
        <button
          appIconButton
          icon="copy"
          type="button"
          class="selection-copy"
          (click)="copy.emit()"
          [disabled]="saving()"
          aria-label="Copy text"
          title="Copy text"
          data-testid="selection-copy"
        ></button>
        @if (canMarkPassage()) {
          <!-- One end of a passage (issue #1014); the second mark, anywhere
               in the book and in either order, opens the save sheet. -->
          <button
            appIconButton
            icon="scroll"
            type="button"
            class="selection-passage"
            [class.is-completing]="passageMarkActive()"
            (click)="markPassage.emit()"
            [disabled]="saving()"
            [attr.aria-label]="passageMarkActive() ? 'Complete passage here' : 'Mark passage'"
            [title]="passageMarkActive() ? 'Complete passage here' : 'Mark passage'"
            data-testid="selection-mark-passage"
          ></button>
        }
      </div>
    }
  </div>
  @if (noteDraftOpen()) {
    <ng-container [ngTemplateOutlet]="selectionNoteField"></ng-container>
  }
  <div class="confirmation-actions selection-decisions">
    <ng-container [ngTemplateOutlet]="selectionCommit"></ng-container>
  </div>
</div>
} @else {
<!-- The docked phone bar (#1255, #1722), at the top (#1344): two rows on phones
     so selection coverage stays minimal — clamped quote + labelled utilities
     on row 1, pen picker + decisions on row 2. -->
<div class="highlight-confirmation" [class.epub-actions]="fileType() === 'epub'" [class.has-note]="noteDraftOpen()" data-testid="selection-bar">
  <div class="confirmation-content">
    <div class="selection-quote-row">
      <blockquote appQuote size="sm" [pen]="highlightColour()" class="selected-text">{{ preview() }}</blockquote>
      @if (!noteDraftOpen()) {
        <div class="selection-utilities">
          <!-- Words, not bare glyphs: the phone bar has no hover, so a word
               label tells what each utility does. -->
          <button
            appButton
            type="button"
            variant="ghost"
            class="selection-copy"
            (click)="copy.emit()"
            [disabled]="saving()"
            aria-label="Copy text"
            title="Copy text"
            data-testid="selection-copy"
          >
            <nostos-icon name="copy" [size]="16"></nostos-icon>
            Copy
          </button>
          @if (canMarkPassage()) {
            <!-- One end of a passage (#1014) is an occasional, two-step
                 action: the shared menu gives it a labelled row instead of
                 crowding the top rail. -->
            <button
              appButton
              variant="ghost"
              type="button"
              class="selection-more"
              [nostosMenuTriggerFor]="selectionMore"
              [disabled]="saving()"
              aria-label="More selection actions"
              title="More selection actions"
              data-testid="selection-more"
            >
              <nostos-icon name="dots-three" [size]="16"></nostos-icon>
              More
            </button>
            <ng-template #selectionMore>
              <nostos-menu aria-label="More selection actions">
                <button
                  nostosMenuItem
                  icon="scroll"
                  [hint]="passageMarkActive() ? 'Ends the passage started earlier' : 'Its other end can come later'"
                  (triggered)="markPassage.emit()"
                  data-testid="selection-mark-passage"
                >{{ passageMarkActive() ? 'Complete passage here' : 'Mark passage' }}</button>
              </nostos-menu>
            </ng-template>
          }
        </div>
      }
    </div>
    @if (noteDraftOpen()) {
      <ng-container [ngTemplateOutlet]="selectionNoteField"></ng-container>
    }
    <div class="confirmation-actions selection-decisions">
      @if (!noteDraftOpen()) {
        <app-pen-picker
          class="selection-pen-picker"
          [value]="highlightColour()"
          [disabled]="saving()"
          triggerTestId="selection-pen-picker"
          testIdPrefix="selection-pen-"
          (chosen)="colourChosen.emit($event)"
        />
      }
      <ng-container [ngTemplateOutlet]="selectionCommit"></ng-container>
    </div>
  </div>
</div>
}

<ng-template #selectionNoteField>
  <div class="selection-note">
    <app-note-composer
      [compact]="true"
      [words]="noteDraft()"
      (wordsChange)="noteWordsChange.emit($event)"
      [topics]="noteDraftTopics()"
      (topicsChange)="noteTopicsChange.emit($event)"
      inputId="selection-note-input"
      ariaLabel="Note for this passage"
      testId="selection-note-input"
      [rows]="3"
      [disabled]="saving()"
      (submitted)="saveNote.emit()"
    />
  </div>
</ng-template>

<ng-template #selectionCommit>
  <!-- Shared decision grammar across both placements (#1722): quiet Cancel on
       the left, commit pair (Add note + Highlight, or Save note) on the right. -->
  <button
    appButton
    type="button"
    variant="ghost"
    class="reader-confirm-action selection-cancel"
    (click)="cancelled.emit()"
    [disabled]="saving()"
    data-testid="selection-cancel"
  >
    Cancel
  </button>
  @if (noteDraftOpen()) {
    <button
      appButton
      type="button"
      variant="primary"
      class="reader-confirm-action selection-primary"
      (click)="saveNote.emit()"
      [disabled]="saving() || !noteDraftReady()"
      [busy]="saving()"
      data-testid="selection-save-note"
    >
      <nostos-icon name="check" [size]="16"></nostos-icon>
      {{ saving() ? 'Saving…' : 'Save note' }}
    </button>
  } @else {
    <button
      appButton
      type="button"
      variant="secondary"
      class="reader-confirm-action selection-note-action"
      (click)="addNote.emit()"
      [disabled]="saving()"
      data-testid="selection-add-note"
    >
      <nostos-icon name="note" [size]="16"></nostos-icon>
      Add note
    </button>
    <button
      appButton
      type="button"
      variant="primary"
      class="reader-confirm-action selection-primary"
      (click)="highlight.emit()"
      [disabled]="saving()"
      [busy]="saving()"
      data-testid="selection-highlight"
    >
      <nostos-icon name="highlighter" [size]="16"></nostos-icon>
      {{ saving() ? 'Saving…' : 'Highlight' }}
    </button>
  }
</ng-template>
