@if (controller.active()) {
<div
  class="read-aloud-bar"
  [class.is-resting]="resting()"
  [attr.aria-hidden]="resting() ? 'true' : null"
  [attr.inert]="resting() ? '' : null"
  role="group"
  aria-label="Read aloud"
  data-testid="read-aloud-bar"
>
  <button
    appButton
    variant="ghost"
    type="button"
    class="read-aloud-voice"
    [nostosMenuTriggerFor]="voiceMenu"
    [attr.aria-label]="'Voice: ' + voiceLabel() + '. Change voice'"
    title="Voice"
    data-testid="read-aloud-voice"
  >
    <nostos-icon name="user-sound" [size]="16"></nostos-icon>
    <span class="read-aloud-chip-label">{{ voiceLabel() }}</span>
    <nostos-icon name="caret-up" [size]="12" class="read-aloud-caret"></nostos-icon>
  </button>

  <span class="read-aloud-divider" aria-hidden="true"></span>

  <div class="read-aloud-transport">
    <button
      appIconButton
      icon="skip-back"
      weight="fill"
      [glyphSize]="18"
      (click)="controller.previous()"
      title="Previous sentence"
      aria-label="Previous sentence"
    ></button>
    <button
      type="button"
      class="read-aloud-toggle"
      [class.is-buffering]="waiting()"
      [attr.aria-busy]="waiting()"
      (click)="controller.toggle()"
      [title]="toggleLabel()"
      [attr.aria-label]="toggleLabel()"
      data-testid="read-aloud-toggle"
    >
      <nostos-icon [name]="controller.playing() ? 'pause' : 'play'" weight="fill" [size]="20"></nostos-icon>
    </button>
    <button
      appIconButton
      icon="skip-forward"
      weight="fill"
      [glyphSize]="18"
      (click)="controller.next()"
      title="Next sentence"
      aria-label="Next sentence"
    ></button>
  </div>

  <span class="read-aloud-divider" aria-hidden="true"></span>

  <nostos-playback-speed-menu
    class="read-aloud-rate"
    label="Reading speed"
    [rate]="controller.rate()"
    [rates]="rates"
    (rateChange)="controller.setRate($event)"
    data-testid="read-aloud-rate"
  />

  <button
    appIconButton
    icon="x"
    [glyphSize]="18"
    (click)="controller.stop()"
    title="Stop reading"
    aria-label="Stop reading"
    data-testid="read-aloud-stop"
  ></button>
</div>
}

<ng-template #voiceMenu>
  <nostos-menu aria-label="Voice" class="read-aloud-menu" data-testid="read-aloud-voice-menu">
    @if (voices().length > 0) {
      <div class="read-aloud-menu-heading" role="presentation">Natural voices</div>
      <div nostosMenuGroup>
        @for (voice of voices(); track voice.id) {
          <button
            nostosMenuItemRadio
            [checked]="selectedVoice() === voice.id"
            [attr.lang]="voice.language"
            (triggered)="voiceChange.emit(voice.id)"
          >{{ label(voice) }}</button>
        }
      </div>
      @if (managed()) {
        <div class="read-aloud-menu-note" role="presentation">Natural voices use your AI allowance.</div>
      }
      <hr nostosMenuSeparator />
    }
    <div nostosMenuGroup>
      <button
        nostosMenuItemRadio
        [checked]="selectedVoice() === 'device'"
        hint="Free, and works without a connection"
        (triggered)="voiceChange.emit('device')"
      >This device’s voice</button>
    </div>
    @if (voiceNote(); as note) {
      <hr nostosMenuSeparator />
      <div class="read-aloud-menu-note" role="note" data-testid="read-aloud-voice-note">{{ note }}</div>
    }
  </nostos-menu>
</ng-template>

@if (controller.notice(); as notice) {
<div class="read-aloud-notice" role="status" aria-live="polite" data-testid="read-aloud-notice">
  <span>{{ notice }}</span>
  <button appIconButton icon="x" size="xs" (click)="controller.dismissNotice()" aria-label="Dismiss"></button>
</div>
}
