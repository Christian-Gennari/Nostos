<main class="layout-wrapper" [class.sidebar-collapsed]="!sidebarExpanded()" [appDrawerFocus]="sidebarExpanded()" drawerPanel=".sidebar-panel" (drawerDismiss)="toggleSidebar()">
  @if (sidebarExpanded()) {
  <div class="mobile-backdrop drawer-scrim" (click)="toggleSidebar()"></div>
  }
  <app-sidebar-collections
    class="sidebar-panel"
    #sidebar
    [class.no-transition]="!sidebar.isLoaded()"
    (booksDropped)="onBooksDropped($event)"
  ></app-sidebar-collections>

  <div class="library-right-side" [class.is-selecting]="selecting()" #resultsScroller>
    <app-library-toolbar
      [searchQuery]="searchQuery()"
      [activeSort]="activeSort()"
      [sortOptions]="sortOptions"
      [viewMode]="viewMode()"
      [viewToggleOptions]="viewToggleOptions"
      [selecting]="selecting()"
      [sidebarExpanded]="sidebarExpanded()"
      [scopeLabel]="scopeLabel()"
      [chips]="activeFilterChips()"
      (search)="onSearch($event)"
      (sortChanged)="setSort($event)"
      (viewModeChanged)="setViewMode($event)"
      (sidebarToggled)="toggleSidebar()"
      (selectingToggled)="toggleSelecting()"
      (addBook)="openAddModal()"
      (chipCleared)="clearChip($event)"
    />

    <div class="container lg">

      <app-add-book-modal
        [isOpen]="showAddModal()"
        [collections]="collections()"
        [sourceFirst]="true"
        (closeModal)="closeAddModal()"
        (bookAdded)="onBookAdded()"
      >
      </app-add-book-modal>

      <app-add-book-modal
        [isOpen]="showEditModal()"
        [collections]="collections()"
        [book]="editTarget()"
        (closeModal)="closeEditModal()"
        (bookUpdated)="onBookUpdated($event)"
        (deleteBook)="openDeleteModal(editTarget()!); closeEditModal()"
      >
      </app-add-book-modal>

      <app-confirm-modal
        [isOpen]="!!deleteTarget()"
        [heading]="deleteCopy().heading"
        [description]="deleteCopy().description"
        [confirmLabel]="deleteCopy().confirmLabel"
        [busyLabel]="deleteCopy().busyLabel"
        [busy]="deletingBook()"
        (confirm)="confirmDelete()"
        (cancel)="cancelDelete()"
      >
      </app-confirm-modal>

      <!-- One stage for both states. While the first page is in flight the region
           is simply left empty — the page's own paper, held open to the height it
           will need — and the results resolve in as they arrive. Nothing is
           drawn in the content's place, so there is nothing whose metrics could
           disagree with the real rows. -->
      <div
        class="results-stage"
        [class.is-swapping]="swapping()"
        [class.is-waiting]="loading()"
        [attr.aria-busy]="swapping() || loading()"
      >
        @if (loadFailed()) {
        <nostos-empty-state
          class="books-empty-state books-load-error"
          error
          icon="book"
          message="Your books could not be loaded."
          (retry)="retryLoad()"
        />
        } @else if (loading()) {
        <!-- Held back a beat (see .results-loading): a fast load never flashes it. -->
        <nostos-loading-indicator class="results-loading" label="Loading your books" />
        } @else {
      @if (viewMode() === 'list') {
      <app-library-book-list
        class="table-view"
        [class.is-selecting]="selecting()"
        [books]="books()"
        [selecting]="selecting()"
        [selected]="selected()"
        [searchQuery]="searchQuery()"
        [hasFilters]="activeFilterChips().length > 0"
        (favoriteToggled)="toggleFavorite($event)"
        (finishedToggled)="toggleFinished($event)"
        (ratingChanged)="updateRating($event.book, $event.rating)"
        (editRequested)="openEditModal($event)"
        (deleteRequested)="openDeleteModal($event)"
        (bookPressed)="onBookPress($event)"
        (selectionChanged)="setSelected($event.id, $event.on)"
        (dragStarted)="onBookDragStart($event.book, $event.event)"
        (hoverStarted)="prefetchHeroCover($event)"
        (hoverEnded)="cancelHeroCoverPrefetch()"
        (clearSearch)="clearChip('search')"
        (clearFilters)="filters.clearAll()"
        (addBook)="openAddModal()"
      />
      } @else {
      <app-library-book-grid
        class="book-grid"
        [class.is-selecting]="selecting()"
        [books]="books()"
        [selecting]="selecting()"
        [selected]="selected()"
        [searchQuery]="searchQuery()"
        [hasFilters]="activeFilterChips().length > 0"
        (favoriteToggled)="toggleFavorite($event)"
        (finishedToggled)="toggleFinished($event)"
        (editRequested)="openEditModal($event)"
        (deleteRequested)="openDeleteModal($event)"
        (bookPressed)="onBookPress($event)"
        (selectionChanged)="setSelected($event.id, $event.on)"
        (dragStarted)="onBookDragStart($event.book, $event.event)"
        (hoverStarted)="prefetchHeroCover($event)"
        (hoverEnded)="cancelHeroCoverPrefetch()"
        (clearSearch)="clearChip('search')"
        (clearFilters)="filters.clearAll()"
        (addBook)="openAddModal()"
      />
      }
      }
      </div>
      @if (!loadFailed()) {
      <nostos-paging-status
        [hasMore]="hasMoreBooks()"
        [loading]="loadingMore()"
        [failed]="loadMoreFailed()"
        label="Loading more books"
        failedMessage="More books could not be loaded."
        (more)="loadMore()"
        (retry)="retryLoadMore()"
      />
      }
    </div>
  </div>
</main>

@if (selecting()) {
<app-library-selection-bar
  [count]="selectedBooks().length"
  [collectionChoices]="collectionChoices()"
  [inCollection]="!!filters.collectionId()"
  (closed)="leaveSelection()"
  (addToCollection)="addToCollection(selectedBooks().map(b => b.id), $event)"
  (removeFromCollection)="removeSelectionFromCollection()"
  (markFinished)="markSelectionFinished()"
  (deleteRequested)="askDeleteSelection()"
/>
}

<app-confirm-modal
  [isOpen]="bulkDeleteOpen()"
  [heading]="bulkDeleteHeading()"
  [description]="bulkDeleteDescription()"
  confirmLabel="Delete permanently"
  busyLabel="Deleting…"
  [busy]="bulkDeleting()"
  (confirm)="confirmBulkDelete()"
  (cancel)="cancelBulkDelete()"
>
</app-confirm-modal>
