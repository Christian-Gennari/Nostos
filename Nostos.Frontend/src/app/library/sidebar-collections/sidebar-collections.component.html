<nav id="library-collections-sidebar" class="side-nav sidebar" [class.collapsed]="!expanded()">
  <div class="sidebar-header">
    <nostos-brand-lockup />
  </div>

  <div class="nav-scroll-area">
    <div class="nav-group">
      <button
        class="nav-item"
        (click)="clearFilters()"
        [class.active]="!hasSelection()"
        data-filter-kind="status"
        title="All books"
      >
        <nostos-icon concept="library" [size]="16" weight="light"></nostos-icon>
        <span class="label">All books</span>
        @if (statusCounts()?.all) {
          <span class="count-badge">{{ statusCounts()?.all }}</span>
        }
      </button>

      <button
        class="nav-item"
        (click)="toggleStatus('notstarted')"
        [class.active]="filters.status() === 'notstarted'"
        data-filter-kind="status"
        [title]="statusLabel.notstarted"
      >
        <nostos-icon name="circle-dashed" [size]="16" weight="light"></nostos-icon>
        <span class="label">{{ statusLabel.notstarted }}</span>
        @if (statusCounts()?.notStarted) {
          <span class="count-badge">{{ statusCounts()?.notStarted }}</span>
        }
      </button>

      <button
        class="nav-item"
        (click)="toggleStatus('reading')"
        [class.active]="filters.status() === 'reading'"
        data-filter-kind="status"
        [title]="statusLabel.reading"
      >
        <nostos-icon name="book-open" [size]="16" weight="light"></nostos-icon>
        <span class="label">{{ statusLabel.reading }}</span>
        @if (statusCounts()?.reading) {
          <span class="count-badge">{{ statusCounts()?.reading }}</span>
        }
      </button>

      <button
        class="nav-item"
        (click)="toggleStatus('favorites')"
        [class.active]="filters.status() === 'favorites'"
        data-filter-kind="status"
        title="Favorites"
      >
        <nostos-icon name="heart" [size]="16" weight="light"></nostos-icon>
        <span class="label">Favorites</span>
        @if (statusCounts()?.favorites) {
          <span class="count-badge">{{ statusCounts()?.favorites }}</span>
        }
      </button>

      <button
        class="nav-item"
        (click)="toggleStatus('finished')"
        [class.active]="filters.status() === 'finished'"
        data-filter-kind="status"
        [title]="statusLabel.finished"
      >
        <nostos-icon name="check-circle" [size]="16" weight="light"></nostos-icon>
        <span class="label">{{ statusLabel.finished }}</span>
        @if (statusCounts()?.finished) {
          <span class="count-badge">{{ statusCounts()?.finished }}</span>
        }
      </button>

    </div>

    <!-- Not a filter: these are books the reader does not have yet, so the
         entry leaves the library for a page of its own. -->
    <div class="nav-group">
      <a class="nav-item" routerLink="/library/to-read" [title]="toReadLabel">
        <nostos-icon name="bookmark-simple" [size]="16" weight="light"></nostos-icon>
        <span class="label">{{ toReadLabel }}</span>
        @if (readingList.loaded() && readingList.count()) {
          <span class="count-badge">{{ readingList.count() }}</span>
        }
      </a>
    </div>

    <div class="nav-group">
      <div class="collapsible">
        <div class="section-label">Media</div>
      </div>

      <button
        class="nav-item"
        (click)="toggleFormat('audiobook')"
        [class.active]="filters.format() === 'audiobook'"
        title="Audiobooks"
      >
        <nostos-icon concept="audiobook" [size]="16" weight="light"></nostos-icon>
        <span class="label">Audiobooks</span>
        @if (statusCounts()?.audiobooks) {
          <span class="count-badge">{{ statusCounts()?.audiobooks }}</span>
        }
      </button>

      <button
        class="nav-item"
        (click)="toggleFormat('ebook')"
        [class.active]="filters.format() === 'ebook'"
        title="EPUBs"
      >
        <nostos-icon concept="ebook" [size]="16" weight="light"></nostos-icon>
        <span class="label">EPUBs</span>
        @if (statusCounts()?.ebooks) {
          <span class="count-badge">{{ statusCounts()?.ebooks }}</span>
        }
      </button>

      <button
        class="nav-item"
        (click)="toggleFormat('pdf')"
        [class.active]="filters.format() === 'pdf'"
        title="PDFs"
      >
        <nostos-icon concept="pdf" [size]="16" weight="light"></nostos-icon>
        <span class="label">PDFs</span>
        @if (statusCounts()?.pdfs) {
          <span class="count-badge">{{ statusCounts()?.pdfs }}</span>
        }
      </button>
    </div>

    <div class="nav-group">
      <div class="collapsible">
        <div class="section-head">
          <span class="section-label">Collections</span>
          @if (!adding()) {
            <button
              appIconButton
              icon="plus"
              size="xxs"
              [glyphSize]="14"
              class="section-add"
              type="button"
              (click)="startAdd()"
              title="New collection"
              aria-label="New collection"
            ></button>
          }
        </div>
      </div>

      <div class="collapsible">
        @if (adding()) {
          <div class="nav-item input-mode">
            <nostos-icon name="plus" [size]="16" weight="light"></nostos-icon>
            <input
              type="text"
              appInput
              controlSize="compact"
              class="sidebar-input"
              [(ngModel)]="newName"
              (keydown.enter)="create()"
              (keydown.escape)="resetInput()"
              placeholder="Name…"
              autoFocus
            />
          </div>
        }
      </div>

      <div class="collapsible">
        <div class="root-drop-list">
          @if (loadFailed()) {
          <nostos-empty-state compact error message="Collections could not be loaded." (retry)="retryLoad()" />
          } @else {
          <app-flat-tree
            [items]="treeItems()"
            [activeId]="filters.collectionId()"
            [editingId]="editingId()"
            [renameError]="renameError()"
            [renameBusy]="renameBusy()"
            [rejectDuplicateNames]="true"
            [treatAllAsFolders]="true"
            [emptyLabel]="'No collections yet'"
            appearance="quiet"
            (nodeSelected)="select($event.id)"
            (nodeMoved)="onItemMoved($event)"
            (nodeRenamed)="startRename($event)"
            (nodeDeleted)="deleteCollection($event)"
            (nodeRenameSaved)="saveRename($event.id, $event.newName)"
            (nodeRenameCancelled)="cancelRename()"
          ></app-flat-tree>
          }
        </div>
      </div>

      <!-- Unsorted is a collections question ("in none of them"), so it closes
           the Collections group instead of sitting among the reading states. It is
           not folded with the tree, so the collapsed rail still offers it. -->
      <button
        class="nav-item"
        (click)="toggleStatus('unsorted')"
        [class.active]="filters.status() === 'unsorted'"
        data-filter-kind="status"
        title="Unsorted"
      >
        <nostos-icon concept="unsorted" [size]="16" weight="light"></nostos-icon>
        <span class="label">Unsorted</span>
        @if (statusCounts()?.unsorted) {
          <span class="count-badge">{{ statusCounts()?.unsorted }}</span>
        }
      </button>
    </div>
  </div>

  <div class="sidebar-footer">
    <div class="footer-slot">
      @if (!expanded() && filters.collectionId()) {
        <span
          class="collapsed-collection-indicator"
          role="status"
          [attr.title]="'Viewing ' + (getNameForId(filters.collectionId()!) || 'collection')"
          aria-label="A collection is selected"
        >
          <nostos-icon name="folder" [size]="14" weight="light"></nostos-icon>
        </span>
      }
      <button
        appIconButton
        [icon]="expanded() ? 'arrow-line-left' : 'arrow-line-right'"
        [glyphSize]="18"
        weight="thin"
        class="toggle-btn"
        type="button"
        (click)="toggle()"
        [attr.aria-expanded]="expanded()"
        [attr.title]="expanded() ? 'Collapse sidebar' : 'Expand sidebar'"
        [attr.aria-label]="expanded() ? 'Collapse sidebar' : 'Expand sidebar'"
      ></button>
    </div>
  </div>

  <!-- The app's single confirmation surface, reused here so deleting a
       collection asks the same question in the same language as deleting a
       book. Held open while the request is in flight (`busy`) so the pending
       state is visible rather than the dialog vanishing mid-action. -->
  <app-confirm-modal
    [isOpen]="!!deleteTarget()"
    [heading]="deleteHeading()"
    [description]="deleteDescription()"
    confirmLabel="Delete collection"
    busyLabel="Deleting…"
    [busy]="deleting()"
    (confirm)="confirmDelete()"
    (cancel)="cancelDelete()"
  ></app-confirm-modal>
</nav>
