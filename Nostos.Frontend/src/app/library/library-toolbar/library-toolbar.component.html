<header class="toolbar toolbar-edge">
  <!-- Static heading: the active-filter chips directly below (and the
       sidebar highlight) already name the current scope, so the heading
       never restates them. -->
  <!-- On a phone the active bottom dock already names the section, so the
       heading is screen-reader-only there. -->
  <h1 id="library-title" class="page-title library-title visually-hidden-phone">Library</h1>

  <nostos-search-field class="search-bar-container">
    <input
      appInput
      controlSize="compact"
      type="search"
      class="search-input"
      placeholder="Search books…"
      aria-label="Search books"
      [value]="searchQuery()"
      (input)="search.emit($event)"
    />
  </nostos-search-field>

  <div class="toolbar-right">
    <!-- Phone only. Navigation anchors the row's left edge: the drawer
         opener is icon-only on the touch rung, and the active-filter chip
         row below carries the shelf's name. aria-label keeps the action
         ("Open collections sidebar") for assistive tech. -->
    <button
      type="button"
      appButton
      variant="ghost"
      class="floating-toggle"
      [class.hidden]="sidebarExpanded()"
      (click)="$event.stopPropagation(); sidebarToggled.emit()"
      [attr.aria-expanded]="sidebarExpanded()"
      aria-controls="library-collections-sidebar"
      [attr.aria-label]="sidebarExpanded() ? 'Close collections sidebar' : 'Open collections sidebar'"
      title="Collections"
    >
      <nostos-icon name="list" [size]="20"></nostos-icon>
      <span class="scope-label" data-testid="library-scope-label">{{ scopeLabel() }}</span>
      <nostos-icon name="caret-down" [size]="14" class="scope-caret"></nostos-icon>
    </button>
    <span class="toolbar-spacer" aria-hidden="true"></span>
    <!-- Phone only: the same sort, as a square button; the open list shows
         the current order. The labelled field below is the desktop control. -->
    <app-dropdown
      class="sort-select-phone"
      appearance="icon"
      triggerIcon="sliders-horizontal"
      align="end"
      ariaLabel="Sort books"
      [options]="sortOptions()"
      [value]="activeSort()"
      (valueChange)="sortChanged.emit($event)"
    />
    <div class="select-wrapper">
      <app-dropdown
        class="sort-select"
        controlSize="compact"
        appearance="subtle"
        ariaLabel="Sort books"
        [options]="sortOptions()"
        [value]="activeSort()"
        (valueChange)="sortChanged.emit($event)"
      />
    </div>

    <button appButton variant="ghost" size="sm" type="button" class="select-toggle" aria-label="Select books"
      [attr.aria-pressed]="selecting()" (click)="selectingToggled.emit()">
      <nostos-icon name="check-square" [size]="16" /><span class="select-label">Select</span>
    </button>

    <nostos-view-toggle
      class="control-group"
      aria-label="Book view"
      [options]="viewToggleOptions()"
      [value]="viewMode()"
      (valueChange)="viewModeChanged.emit($event)"
    />

    <button appButton variant="primary" class="library-add-button" (click)="addBook.emit()">
      <nostos-icon name="plus" [size]="18"></nostos-icon>
      <span class="btn-text">Add book</span>
    </button>
  </div>
</header>

<!-- On a phone the scope chip here is the shelf's name: the toolbar's
     drawer opener is icon-only. `scope-only` marks a bar with no search
     chip, and `.is-empty` lets it keep zero height when nothing is set. -->
<div
  class="filter-bar"
  [class.is-empty]="chips().length === 0"
  [class.scope-only]="!searchQuery().trim()"
>
  <div class="filter-bar-inner">
    <div class="active-filters" role="status" aria-label="Active filters">
      @for (chip of chips(); track chip.key) {
      <button
        appChip
        class="filter-chip"
        [class.filter-chip--scope]="chip.key !== 'search'"
        (click)="chipCleared.emit(chip.key)"
        [title]="'Clear ' + chip.label"
      >
        <span>{{ chip.label }}</span>
        <nostos-icon name="x" [size]="14"></nostos-icon>
      </button>
      }
    </div>
  </div>
</div>
