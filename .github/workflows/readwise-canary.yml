name: Readwise format canary

# Issue #1525: the one import source with an account we can test against. Once a
# week, call Readwise's documented export API with the repository's
# READWISE_CANARY_TOKEN, first page only, and fail when a field the mapper reads
# disappears or changes type. The job prints JSON paths and types; never a
# title, an author or a highlight.

on:
  schedule:
    # Mondays at 06:17 UTC, away from the top of the hour.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readwise-format-canary
  cancel-in-progress: false

jobs:
  export-shape:
    name: Readwise export schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      # NuGet packages are cached by hand: there is no packages.lock.json, so
      # actions/setup-dotnet's `cache` input (which requires one) cannot be
      # used. The key is the project files; restore-keys falls back to the
      # newest cache for this runner, and the package folder only grows, so a
      # partial hit still avoids most downloads.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Check the first page of Readwise's export
        env:
          READWISE_CANARY_TOKEN: ${{ secrets.READWISE_CANARY_TOKEN }}
        run: dotnet run --project tools/ReadwiseCanary/ReadwiseCanary.csproj --configuration Release
