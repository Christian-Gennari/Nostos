name: PostgreSQL product-schema compatibility

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-schema-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: nostos_product
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nostos_product"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NOSTOS_POSTGRES_SPIKE_CONNECTION: "Host=127.0.0.1;Port=5432;Database=nostos_product;Username=postgres;Include Error Detail=true"
      GH_TOKEN: ""
      NOSTOS_CLOUD_GH_TOKEN: ""
    steps:
      - name: Checkout public Nostos
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Nostos.sln

      - name: Build
        run: dotnet build Nostos.sln --configuration Debug --no-restore

      - name: Exercise the canonical product model on PostgreSQL
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --filter "Category=PostgresSpike"
          --logger "console;verbosity=normal"
