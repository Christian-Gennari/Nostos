name: PostgreSQL product-schema compatibility

on:
  workflow_call:
    inputs:
      docs_only:
        description: Skip the jobs because only documentation changed. They still report, as skipped, so required checks pass.
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-schema-compatibility:
    if: ${{ !inputs.docs_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: nostos_product
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nostos_product"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NOSTOS_POSTGRES_SPIKE_CONNECTION: "Host=127.0.0.1;Port=5432;Database=nostos_product;Username=postgres;Include Error Detail=true"
      GH_TOKEN: ""
      NOSTOS_CLOUD_GH_TOKEN: ""
    steps:
      - name: Checkout public Nostos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Nostos.sln

      - name: Build
        run: dotnet build Nostos.sln --configuration Debug --no-restore

      - name: Exercise the canonical product model on PostgreSQL
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --filter "Category=PostgresSpike"
          --logger "console;verbosity=normal"
