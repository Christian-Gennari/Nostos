# Scheduled real-backend acceptance lane for library export/import/activation
# (#680 slice B10). Not part of the per-push CI: one Chromium run of the full
# disposable-backend suite takes several minutes. This lane gives the
# destructive migration feature an automated cross-check on a weekly cadence
# and on demand; the cross-browser (Firefox/WebKit) and mobile runs stay a
# local/manual acceptance step documented in docs/library-transfer-browser-qa.md.
name: Library transfer browser QA (scheduled)

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library-transfer-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Nostos.Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Nostos.Frontend/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build backend (Debug, the fixture's host)
        working-directory: .
        run: dotnet build Nostos.Backend/Nostos.Backend.csproj -c Debug --nologo

      - name: Build frontend (production bundle served by the fixture)
        run: npm run build

      - name: Resolve the installed Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browser download is cached per Playwright version; the system
      # libraries it needs are installed on every run.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # The runner image already carries Chromium's runtime libraries; apt
      # mostly adds fonts. When the Ubuntu mirrors cannot be reached (#1570),
      # carry on only if every package apt could not fetch is a font package;
      # any other missing package still fails the job.
      - name: Install Playwright system dependencies
        run: |
          set -o pipefail
          if npx playwright install-deps chromium 2>&1 | tee "$RUNNER_TEMP/playwright-deps.log"; then
            exit 0
          fi
          missing=$(grep -oE 'Failed to fetch [^ ]+/pool/[^ ]+_' "$RUNNER_TEMP/playwright-deps.log" \
            | sed -E 's#.*/([^/_]+)_.*#\1#' | sort -u)
          if [ -z "$missing" ]; then
            echo "::error::Playwright system dependencies failed for a reason other than unreachable packages."
            exit 1
          fi
          other=$(echo "$missing" | grep -vE '^x?fonts-' || true)
          if [ -n "$other" ]; then
            echo "::error::Could not install required packages: $(echo $other)"
            exit 1
          fi
          echo "::warning::Ubuntu mirrors unreachable; continuing without optional font packages: $(echo $missing)"

      - name: Library transfer browser QA (Chromium)
        env:
          E2E_SKIP_BUILDS: "1"
        run: npx playwright test --config playwright.library-transfer.config.ts --project=lt-chromium

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: library-transfer-browser-qa-failure-artifacts
          if-no-files-found: ignore
          path: |
            Nostos.Frontend/e2e/test-results/library-transfer-artifacts/**
            Nostos.Frontend/e2e/test-results/library-transfer-report/**
            Nostos.Frontend/e2e/test-results/library-transfer/**/*.log
