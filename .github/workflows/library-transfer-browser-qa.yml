# Scheduled real-backend acceptance lane for library export/import/activation
# (#680 slice B10). Not part of the per-push CI: one Chromium run of the full
# disposable-backend suite takes several minutes. This lane gives the
# destructive migration feature an automated cross-check on a weekly cadence
# and on demand; the cross-browser (Firefox/WebKit) and mobile runs stay a
# local/manual acceptance step documented in docs/library-transfer-browser-qa.md.
name: Library transfer browser QA (scheduled)

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library-transfer-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Nostos.Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Nostos.Frontend/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build backend (Debug, the fixture's host)
        working-directory: .
        run: dotnet build Nostos.Backend/Nostos.Backend.csproj -c Debug --nologo

      - name: Build frontend (production bundle served by the fixture)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Library transfer browser QA (Chromium)
        env:
          E2E_SKIP_BUILDS: "1"
        run: npx playwright test --config playwright.library-transfer.config.ts --project=lt-chromium

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: library-transfer-browser-qa-failure-artifacts
          if-no-files-found: ignore
          path: |
            Nostos.Frontend/e2e/test-results/library-transfer-artifacts/**
            Nostos.Frontend/e2e/test-results/library-transfer-report/**
            Nostos.Frontend/e2e/test-results/library-transfer/**/*.log
