name: Scheduled weekly release

on:
  schedule:
    # Run every Sunday at 18:00 UTC
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  # Reads Public product CI runs to find the newest green main revision.
  actions: read
  # Adds the CalVer tag to the SelfHosted image already built for that revision.
  packages: write

# A scheduled and a manual run must never compute the same version or repair
# the same release at once.
concurrency:
  group: scheduled-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish weekly CalVer release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A release is the git tag, the image tag and the GitHub Release
      # together. If an earlier run stopped part-way, finish the newest
      # release before deciding whether there is anything new to release:
      # its revision counts as released from here on, so nothing else would.
      - name: Repair the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t TAGS < <(git tag -l 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*' --sort=-v:refname | head -n 2)
          if [ "${#TAGS[@]}" -eq 0 ]; then
            echo "No CalVer release yet; nothing to repair."
            exit 0
          fi
          LATEST_TAG="${TAGS[0]}"
          PREVIOUS_REF="${TAGS[1]:-7db4e3ddd484f1c56486d92a24475c6df544c570}"
          scripts/ensure-release.sh "$LATEST_TAG" "$(git rev-list -n 1 "refs/tags/$LATEST_TAG")" "$PREVIOUS_REF"

      - name: Determine release range and generate notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Find the latest CalVer tag (vYYYY.MM.DD[.N]) on main
          # If no CalVer tag exists yet, fall back to the initial baseline pin
          LATEST_TAG=$(git tag -l 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*' --sort=-v:refname | head -n 1 || true)
          if [ -z "$LATEST_TAG" ]; then
            BASE_REF="7db4e3ddd484f1c56486d92a24475c6df544c570"
          else
            BASE_REF="$LATEST_TAG"
          fi

          # Release the newest main revision that passed Public product CI, not
          # whatever main's tip is: the tip may be red, still running, or a run
          # cancelled by a newer push.
          HEAD_REF=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          if ! [[ "$HEAD_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No Public product CI run on main has passed; nothing to release." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$HEAD_REF" "$(git rev-parse HEAD)"; then
            echo "The last green revision $HEAD_REF is not on main." >&2
            exit 1
          fi
          if [ "$BASE_REF" != "$HEAD_REF" ] && git merge-base --is-ancestor "$HEAD_REF" "$BASE_REF"; then
            echo "The last green revision is already released in $BASE_REF. Skipping release."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Base ref: $BASE_REF"
          echo "Head ref: $HEAD_REF"

          # Compute today's CalVer tag
          TODAY=$(date -u +'%Y.%m.%d')
          CALVER="v${TODAY}"
          SUFFIX=1
          while git rev-parse -q --verify "refs/tags/${CALVER}" >/dev/null; do
            CALVER="v${TODAY}.${SUFFIX}"
            SUFFIX=$((SUFFIX + 1))
          done
          echo "Target version: $CALVER"

          # Generate notes to a temporary file
          python3 scripts/generate-release-notes.py \
            --from "$BASE_REF" \
            --to "$HEAD_REF" \
            --version "$CALVER" > /tmp/release-notes.md

          # Check if there are actual reader-facing changes (beyond headers/empty notice)
          if grep -q "No reader-facing changes in this range." /tmp/release-notes.md; then
            echo "No reader-facing changes found in range. Skipping release."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "version=$CALVER" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"

      # The image for this exact revision must exist before anything is
      # tagged, so a release can never point at a revision nobody can run.
      # Then: git tag, image tag, and only last the visible GitHub Release.
      # Each piece is skipped when present and checked against the revision.
      - name: Publish tag, image tag and GitHub Release
        if: steps.notes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.notes.outputs.version }}
          HEAD_REF: ${{ steps.notes.outputs.head_ref }}
          BASE_REF: ${{ steps.notes.outputs.base_ref }}
        run: scripts/ensure-release.sh "$VERSION" "$HEAD_REF" "$BASE_REF" /tmp/release-notes.md
