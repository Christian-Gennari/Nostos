# Requires every pull request title to be a Conventional Commit.
#
# The release notes come from PR titles, not branch commits:
# scripts/generate-release-notes.py looks up each merged PR and reads its title
# and labels. A title that is not conventional silently drops out of the notes,
# so this check is required on main. The types are the ones the generator
# knows (docs/releases.md).
#
# pull_request_target so the check also runs when a fork's PR title is edited.
# It never checks out or runs the PR's code.
name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            ux
            revert
            refactor
            docs
            test
            ci
            build
            chore
            style
