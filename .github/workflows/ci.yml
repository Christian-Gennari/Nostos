name: Public product CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dual-mode-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Documentation-only changes skip the expensive jobs. They are skipped with
  # `if:` rather than by not triggering the workflow, because a skipped job
  # still reports its required check as passed and a workflow that never runs
  # leaves it pending. Anything uncertain counts as a code change.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
      stores: ${{ steps.stores.outputs.stores }}
    steps:
      - name: Checkout history without file contents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts/only-docs-changed.sh
          sparse-checkout-cone-mode: false

      - name: Compare with the previous revision
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            # The checked-out merge commit's first parent is the base branch.
            pull_request) base="$(git rev-parse HEAD^1 2>/dev/null || true)" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if scripts/only-docs-changed.sh "$base" HEAD; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

      # The app-store templates describe the image the Dockerfile builds, so
      # they are checked whenever either side moves. This is a narrower question
      # than "did code change": a README tweak under deploy/app-stores/ does not
      # need a container build, but it does need check.py.
      - name: Detect Dockerfile or app-store packaging changes
        id: stores
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            # The checked-out merge commit's first parent is the base branch.
            pull_request) base="$(git rev-parse HEAD^1 2>/dev/null || true)" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # Unknown base: check the packages rather than silently skip them.
            echo "stores=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only --no-renames "$base" HEAD)" || {
            echo "Could not diff $base..HEAD; checking the packages anyway."
            echo "stores=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if printf '%s\n' "$changed" | grep -qE '^(Dockerfile|deploy/app-stores/)'; then
            echo "stores=true" >> "$GITHUB_OUTPUT"
          else
            echo "stores=false" >> "$GITHUB_OUTPUT"
          fi

  app-store-packages:
    name: App-store packages
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.stores == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the app-store packages against the Dockerfile
        run: |
          set -euo pipefail
          # check.py needs PyYAML only. The runner's system Python is externally
          # managed, so install into a throwaway virtualenv.
          python3 -m venv "$RUNNER_TEMP/app-stores"
          "$RUNNER_TEMP/app-stores/bin/pip" install --quiet PyYAML
          "$RUNNER_TEMP/app-stores/bin/python" deploy/app-stores/check.py

  public-boundary-and-backend:
    name: Public boundary and backend regression
    needs: changes
    # Runs even if change detection failed; then everything runs.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOSTOS_POSTGRES_SPIKE_CONNECTION: ""
      GH_TOKEN: ""
      NOSTOS_CLOUD_GH_TOKEN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard the public/private repository boundary
        run: python3 scripts/guard-public-private-boundary.py

      - name: Release notes generator tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Setup .NET 10
        if: needs.changes.outputs.code != 'false'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      # NuGet packages are cached by hand: there is no packages.lock.json, so
      # actions/setup-dotnet's `cache` input (which requires one) cannot be
      # used. The key is the project files; restore-keys falls back to the
      # newest cache for this runner, and the package folder only grows, so a
      # partial hit still avoids most downloads.
      - name: Cache NuGet packages
        if: needs.changes.outputs.code != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore
        if: needs.changes.outputs.code != 'false'
        run: dotnet restore Nostos.sln

      - name: Guard Product source ownership
        if: needs.changes.outputs.code != 'false'
        run: python3 scripts/guard-product-source-ownership.py

      - name: Build solution
        if: needs.changes.outputs.code != 'false'
        run: dotnet build Nostos.sln --configuration Debug --no-restore

      - name: Run ordinary backend regression
        if: needs.changes.outputs.code != 'false'
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --logger "console;verbosity=minimal"

  selfhosted:
    name: SelfHosted / SQLite
    uses: ./.github/workflows/selfhosted-integration.yml
    needs: changes
    if: ${{ !cancelled() }}
    with:
      docs_only: ${{ needs.changes.outputs.code == 'false' }}

  postgresql-compatibility:
    name: PostgreSQL product-schema compatibility
    uses: ./.github/workflows/postgresql-compatibility.yml
    needs: changes
    if: ${{ !cancelled() }}
    with:
      docs_only: ${{ needs.changes.outputs.code == 'false' }}

  frontend:
    name: Frontend
    uses: ./.github/workflows/frontend.yml
    needs: changes
    if: ${{ !cancelled() }}
    with:
      docs_only: ${{ needs.changes.outputs.code == 'false' }}

  selfhosted-container:
    name: SelfHosted container
    uses: ./.github/workflows/selfhosted-container.yml
    needs: changes
    if: ${{ !cancelled() }}
    with:
      docs_only: ${{ needs.changes.outputs.code == 'false' }}
