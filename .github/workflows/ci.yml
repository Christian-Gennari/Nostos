name: Public product CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dual-mode-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Documentation-only changes skip the expensive jobs. They are skipped with
  # `if:` rather than by not triggering the workflow, because a skipped job
  # still reports its required check as passed and a workflow that never runs
  # leaves it pending. Anything uncertain counts as a code change.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout history without file contents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts/only-docs-changed.sh
          sparse-checkout-cone-mode: false

      - name: Compare with the previous revision
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            # The checked-out merge commit's first parent is the base branch.
            pull_request) base="$(git rev-parse HEAD^1 2>/dev/null || true)" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if scripts/only-docs-changed.sh "$base" HEAD; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  public-boundary-and-backend:
    name: Public boundary and backend regression
    needs: changes
    # Runs even if change detection failed; then everything runs.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOSTOS_POSTGRES_SPIKE_CONNECTION: ""
      GH_TOKEN: ""
      NOSTOS_CLOUD_GH_TOKEN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard the public/private repository boundary
        run: python3 scripts/guard-public-private-boundary.py

      - name: Release notes generator tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Setup .NET 10
        if: needs.changes.outputs.code != 'false'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Test offline alignment experiment
        if: needs.changes.outputs.code != 'false'
        run: |
          dotnet test tools/Nostos.Alignment.Spike.Tests/Nostos.Alignment.Spike.Tests.csproj --configuration Release
          python3 -m unittest discover -s tools/Nostos.Alignment.Spike.Tests -p 'test_*.py' -v

      - name: Restore
        if: needs.changes.outputs.code != 'false'
        run: dotnet restore Nostos.sln

      - name: Guard Product source ownership
        if: needs.changes.outputs.code != 'false'
        run: python3 scripts/guard-product-source-ownership.py

      - name: Build solution
        if: needs.changes.outputs.code != 'false'
        run: dotnet build Nostos.sln --configuration Debug --no-restore

      - name: Run ordinary backend regression
        if: needs.changes.outputs.code != 'false'
        run: >-
          dotnet test Nostos.Backend.Tests/Nostos.Backend.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --logger "console;verbosity=minimal"

  selfhosted:
    name: SelfHosted / SQLite
    uses: ./.github/workflows/selfhosted-integration.yml
    needs: changes
    if: ${{ !cancelled() }}
    with:
      docs_only: ${{ needs.changes.outputs.code == 'false' }}

  postgresql-compatibility:
    name: PostgreSQL product-schema compatibility
    uses: ./.github/workflows/postgresql-compatibility.yml
    needs: changes
    if: ${{ !cancelled() }}
    with:
      docs_only: ${{ needs.changes.outputs.code == 'false' }}

  frontend:
    name: Frontend
    uses: ./.github/workflows/frontend.yml
    needs: changes
    if: ${{ !cancelled() }}
    with:
      docs_only: ${{ needs.changes.outputs.code == 'false' }}

  selfhosted-container:
    name: SelfHosted container
    uses: ./.github/workflows/selfhosted-container.yml
    needs: changes
    if: ${{ !cancelled() }}
    with:
      docs_only: ${{ needs.changes.outputs.code == 'false' }}
