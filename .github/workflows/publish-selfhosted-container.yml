name: Publish SelfHosted container

on:
  pull_request:
    paths:
      - ".github/workflows/publish-selfhosted-container.yml"
      - "Dockerfile"
      - "compose.yml"
      - "README.md"
  workflow_run:
    workflows:
      - Public product CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

jobs:
  validate-definition:
    name: Validate SelfHosted package definition
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose release contract
        run: |
          set -euo pipefail
          docker compose config --quiet
          grep -Fq 'ghcr.io/christian-gennari/nostos:${NOSTOS_IMAGE_TAG:-latest}' compose.yml

  publish:
    name: Publish public SelfHosted image
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      digest: ${{ steps.reuse.outputs.digest || steps.build.outputs.digest }}

    steps:
      - name: Resolve successful main revision
        id: source
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full 40-character source SHA" >&2
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=selfhosted-sha-$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact successful revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          # The parent too, to tell whether only documentation changed.
          fetch-depth: 2

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A documentation-only revision builds the same image as its parent.
      # Give it the parent's digest under its own revision tag instead of
      # building and pushing another identical image; the release workflow
      # needs selfhosted-sha-<revision> for every revision it may release.
      # The digest is still verified below before latest can move.
      - name: Reuse the parent image for a documentation-only revision
        id: reuse
        env:
          IMAGE: ghcr.io/christian-gennari/nostos
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          parent="$(git rev-parse -q --verify "$SOURCE_SHA^1" || true)"
          if [ -z "$parent" ] || [ ! -x scripts/only-docs-changed.sh ] \
            || ! scripts/only-docs-changed.sh "$parent" "$SOURCE_SHA"; then
            echo "Building a new image."
            exit 0
          fi
          digest="$(docker buildx imagetools inspect "$IMAGE:selfhosted-sha-$parent" --format '{{json .Manifest}}' 2>/dev/null \
            | jq -r '.digest // empty' || true)"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "No published image for parent $parent; building a new image."
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:selfhosted-sha-$SOURCE_SHA" "$IMAGE@$digest"
          echo "::notice::Only documentation changed since $parent; selfhosted-sha-$SOURCE_SHA reuses its image $digest."
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build and publish SelfHosted image
        id: build
        if: steps.reuse.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          push: true
          # Written by the SelfHosted container job in CI, which has just
          # built this revision on main.
          cache-from: type=gha,scope=selfhosted-image
          build-args: |
            SOURCE_REVISION=${{ steps.source.outputs.sha }}
          # Only the immutable revision tag here. `latest` moves in the
          # promote job, after this exact digest has passed the runtime check.
          tags: |
            ghcr.io/christian-gennari/nostos:${{ steps.source.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/Christian-Gennari/Nostos
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.title=Nostos
            org.opencontainers.image.description=SelfHosted Nostos reading, thinking and writing environment

      - name: Verify anonymous pull and persistent SelfHosted runtime
        env:
          IMAGE_REF: ghcr.io/christian-gennari/nostos@${{ steps.reuse.outputs.digest || steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          # Public SelfHosted users must not need GitHub credentials.
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker image rm "$IMAGE_REF" >/dev/null 2>&1 || true
          docker pull "$IMAGE_REF"

          volume="nostos-published-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          first="nostos-published-first"
          second="nostos-published-second"
          port=18082

          cleanup() {
            docker rm -f "$first" "$second" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$volume" >/dev/null

          start_container() {
            local name="$1"
            docker run -d \
              --name "$name" \
              -p "$port:8080" \
              -v "$volume:/data" \
              "$IMAGE_REF" >/dev/null

            for i in $(seq 1 45); do
              if curl -fsS "http://127.0.0.1:$port/health/ready" >/dev/null; then
                return 0
              fi
              if [ "$i" -eq 45 ]; then
                docker logs "$name"
                return 1
              fi
              sleep 2
            done
          }

          start_container "$first"

          curl -fsS "http://127.0.0.1:$port/" >/dev/null
          curl -fsS "http://127.0.0.1:$port/api/runtime/capabilities" \
            | grep -q '"deploymentMode":"SelfHosted"'

          title="Published image persistence ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          created="$(curl -fsS \
            -H 'Content-Type: application/json' \
            -X POST \
            --data "{\"type\":\"physical\",\"title\":\"$title\"}" \
            "http://127.0.0.1:$port/api/books/")"
          book_id="$(printf '%s' "$created" | jq -er '.id')"

          docker exec "$first" test -s /data/nostos.db
          runtime_user="$(docker inspect -f '{{.Config.User}}' "$first")"
          test -n "$runtime_user"
          test "$runtime_user" != "0"

          docker rm -f "$first" >/dev/null
          start_container "$second"

          persisted="$(curl -fsS "http://127.0.0.1:$port/api/books/$book_id")"
          printf '%s' "$persisted" | jq -e \
            --arg id "$book_id" \
            --arg title "$title" \
            '.id == $id and .title == $title' >/dev/null

  promote-latest:
    name: Promote verified image to latest
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    # One promotion at a time, so reading what `latest` points at and moving
    # it cannot interleave with another run. A queued promotion is replaced by
    # a newer one, which is fine: the newer revision contains the older one.
    concurrency:
      group: publish-selfhosted-latest
      cancel-in-progress: false

    steps:
      - name: Checkout main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Never move `latest` backwards: a slow run, or a re-run of an old CI
      # run, can finish after a newer revision was promoted.
      - name: Decide whether the candidate may become latest
        id: decide
        env:
          IMAGE: ghcr.io/christian-gennari/nostos
          CANDIDATE_SHA: ${{ needs.publish.outputs.sha }}
        run: |
          set -euo pipefail

          current=""
          if config="$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Image}}' 2>/dev/null)"; then
            # A single-platform image gives one config; a multi-platform
            # index gives one per platform. Any of them carries the label.
            current="$(printf '%s' "$config" | jq -r \
              '[.. | objects | .Labels? // empty | .["org.opencontainers.image.revision"]? // empty] | first // empty' \
              2>/dev/null || true)"
          fi

          if ! [[ "$current" =~ ^[0-9a-f]{40}$ ]]; then
            echo "latest is missing or has no revision label; promoting $CANDIDATE_SHA."
            echo "promote=true" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$current^{commit}" 2>/dev/null; then
            echo "::warning::latest points at $current, which is not in this repository's history; promoting $CANDIDATE_SHA."
            echo "promote=true" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor "$current" "$CANDIDATE_SHA"; then
            echo "latest is at $current, which $CANDIDATE_SHA contains; promoting."
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not promoting $CANDIDATE_SHA: latest is already at $current, which it does not contain. selfhosted-sha-$CANDIDATE_SHA stays published."
            echo "promote=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Point latest at the verified digest
        if: steps.decide.outputs.promote == 'true'
        env:
          IMAGE: ghcr.io/christian-gennari/nostos
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Expected the verified image digest, got '$DIGEST'" >&2
            exit 1
          fi
          # Same digest, one more name: nothing is rebuilt.
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"

          promoted="$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -r '.digest')"
          if [ "$promoted" != "$DIGEST" ]; then
            echo "latest resolves to $promoted, expected $DIGEST" >&2
            exit 1
          fi
          echo "latest now points at $DIGEST"
