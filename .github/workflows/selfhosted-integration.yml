name: SelfHosted integration

on:
  workflow_call:
    inputs:
      docs_only:
        description: Skip the jobs because only documentation changed. They still report, as skipped, so required checks pass.
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfhosted:
    if: ${{ !inputs.docs_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NOSTOS_POSTGRES_SPIKE_CONNECTION: ""
      GH_TOKEN: ""
      NOSTOS_CLOUD_GH_TOKEN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      # NuGet packages are cached by hand: there is no packages.lock.json, so
      # actions/setup-dotnet's `cache` input (which requires one) cannot be
      # used. The key is the project files; restore-keys falls back to the
      # newest cache for this runner, and the package folder only grows, so a
      # partial hit still avoids most downloads.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore
        run: dotnet restore Nostos.sln

      - name: Build backend solution
        run: dotnet build Nostos.sln --configuration Debug --no-restore

      - name: Start the public host and verify SelfHosted SQLite bootstrap
        run: bash scripts/verify-selfhosted-smoke.sh Debug
