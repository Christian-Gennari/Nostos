name: SelfHosted integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfhosted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NOSTOS_POSTGRES_SPIKE_CONNECTION: ""
      GH_TOKEN: ""
      NOSTOS_CLOUD_GH_TOKEN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Nostos.sln

      - name: Build backend solution
        run: dotnet build Nostos.sln --configuration Debug --no-restore

      - name: Start the public host and verify SelfHosted SQLite bootstrap
        run: bash scripts/verify-selfhosted-smoke.sh Debug
