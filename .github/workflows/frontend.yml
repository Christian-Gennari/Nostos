# Shared frontend gate used by the dual-mode CI orchestrator.
#
# Two parallel jobs: design checks and unit tests, and the production build
# with the browser lanes. The job id `frontend` is kept for the first so the
# required check "Frontend / frontend" keeps its name.
name: Frontend

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Nostos.Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Nostos.Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Design checks (CSS integrity, theme tokens, design language)
        run: npm run check

      # Most of this step is jsdom and Angular set up afresh per spec file,
      # which `isolate: true` requires (see vitest-base.config.ts).
      - name: Unit tests
        run: npm test -- --watch=false

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Nostos.Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Nostos.Frontend/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Resolve the installed Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browser download is cached per Playwright version; the system
      # libraries it needs are installed on every run.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Launcher lifecycle regression
        run: node e2e/support/launch-regression.mjs

      - name: Reader interaction and Capture source browser smoke
        env:
          E2E_SKIP_BUILDS: "1"
        run: >-
          npx playwright test
          e2e/reader-search.spec.ts
          e2e/reader-margin-presets.spec.ts
          e2e/reader-selection-actions.spec.ts
          e2e/mobile-reader-selection-actions.spec.ts
          e2e/capture-source-studio-smoke.spec.ts

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-e2e-failure-artifacts
          if-no-files-found: ignore
          path: |
            Nostos.Frontend/e2e/test-results/artifacts/**
            Nostos.Frontend/e2e/test-results/playwright-report/**
            Nostos.Frontend/e2e/test-results/**/*.log
