# Shared frontend gate used by the dual-mode CI orchestrator.
#
# Two parallel jobs: design checks and unit tests, and the production build
# with the browser lanes. The job id `frontend` is kept for the first so the
# required check "Frontend / frontend" keeps its name.
name: Frontend

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Nostos.Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Nostos.Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Design checks (CSS integrity, theme tokens, design language)
        run: npm run check

      # Most of this step is jsdom and Angular set up afresh per spec file,
      # which `isolate: true` requires (see vitest-base.config.ts).
      - name: Unit tests
        run: npm test -- --watch=false

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Nostos.Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Nostos.Frontend/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Resolve the installed Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browser download is cached per Playwright version; the system
      # libraries it needs are installed on every run.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Launcher lifecycle regression
        run: node e2e/support/launch-regression.mjs

      - name: Reader interaction and Capture source browser smoke
        env:
          E2E_SKIP_BUILDS: "1"
        run: >-
          npx playwright test
          e2e/reader-search.spec.ts
          e2e/reader-margin-presets.spec.ts
          e2e/reader-selection-actions.spec.ts
          e2e/mobile-reader-selection-actions.spec.ts
          e2e/capture-source-studio-smoke.spec.ts

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-failure-artifacts
          if-no-files-found: ignore
          path: |
            Nostos.Frontend/e2e/test-results/artifacts/**
            Nostos.Frontend/e2e/test-results/playwright-report/**
            Nostos.Frontend/e2e/test-results/**/*.log
