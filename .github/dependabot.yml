# Weekly dependency update PRs, grouped so a week is a handful of PRs rather
# than one per package. Titles come out as `chore(deps): …`, which the
# Conventional PR title check accepts. Raised in the CI/CD audit (#1066).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: [/, /Nostos.Frontend]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Angular's packages share one version and peer-depend on each other,
      # so a major only installs when they all move together (#1132/#1133
      # failed with ERESOLVE as single-package bumps).
      # ngx-extended-pdf-viewer caps its Angular peer range per major, so the
      # Angular 22 bump (#1148) needed it moved in the same PR.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/angular", "ngx-extended-pdf-viewer"]
      # Dependabot ranks a group with update-types as more specific than a
      # pattern-only one, so Angular has to be excluded here or its majors
      # fall out as single-package PRs again (#1140-#1143).
      npm-minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["@angular/*", "@angular-devkit/*", "@schematics/angular", "ngx-extended-pdf-viewer"]
    ignore:
      # Angular's compiler pins a TypeScript range to a minor (Angular 22:
      # >=6.0 <6.1), so a TypeScript major or minor never installs on its own
      # (#1151 proposed 7.0). It moves by hand with an Angular major.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # FluentAssertions 8+ is under a paid commercial licence (Xceed);
      # Nostos Cloud is commercial use. Stay on 7.x and below.
      - dependency-name: FluentAssertions
        versions: [">= 8.0.0"]
      # Microsoft.OpenApi moves with Microsoft.AspNetCore.OpenApi: its source
      # generator does not compile against a newer major (#1138).
      - dependency-name: Microsoft.OpenApi
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Node majors alternate LTS and short-lived releases (#1127 proposed 25).
      # The image moves to the next LTS by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]
